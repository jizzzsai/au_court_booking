# Domain route for AU Campus Court. The IP-only and default sites remain enabled.
server {
    listen 80;
    listen [::]:80;
    server_name bad-sashs.japaneast.cloudapp.azure.com;
    root /var/www/html;

    # Certbot webroot renewals must remain reachable over HTTP.
    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bad-sashs.japaneast.cloudapp.azure.com;

    ssl_certificate /etc/letsencrypt/live/bad-sashs.japaneast.cloudapp.azure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bad-sashs.japaneast.cloudapp.azure.com/privkey.pem;

    root /var/www/html;
    index index.html index.htm index.nginx-debian.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /au-campus-court {
        return 301 /au-campus-court/;
    }

    location ^~ /au-campus-court/ {
        # Preserve the complete base-path URL when proxying to the web container.
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
