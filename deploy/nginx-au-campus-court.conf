# Separate IP-based server block for the VM test. The default Nginx site stays
# enabled and untouched; the root path keeps serving its normal static files.
# Replace server_name with the FQDN when DNS is ready.
server {
    listen 80;
    listen [::]:80;
    server_name 135.149.56.57;

    root /var/www/html;
    index index.html index.htm index.nginx-debian.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /au-campus-court {
        return 301 /au-campus-court/;
    }

    location ^~ /au-campus-court/ {
        # No URI suffix: Nginx forwards the complete base-path URL unchanged.
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
